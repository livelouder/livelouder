[build]
  command = "python3 build.py"
  publish = "site"

[[plugins]]
  package = "/netlify/plugins/keep-cache"

# Shared profiles: livelouder.com.au/u/<username> shows the profile page (people.js reads the name from the address).
[[redirects]]
  from = "/u/*"
  to = "/u/index.html"
  status = 200
